global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'face-analytics-pro'

scrape_configs:
  - job_name: 'face_analytics_backend'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'face-analytics-backend'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
