version: "3.9"

services:
  # -- PostgreSQL Database ------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: face_analytics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: face_analytics
      POSTGRES_USER: ${POSTGRES_USER:-faceadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faceadmin} -d face_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - face_net

  # -- Redis Cache + Celery Broker ----------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: face_analytics_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - face_net

  # -- Backend API --------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face_analytics_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-faceadmin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/face_analytics
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      RATE_LIMIT_BACKEND: redis
      TRUST_PROXY_HEADERS: "1"
      METRICS_ALLOW_PRIVATE: "1"
      MEDIA_MIN_FREE_GB: ${MEDIA_MIN_FREE_GB:-2}
      MEDIA_MAX_GB: ${MEDIA_MAX_GB:-0}
    volumes:
      - backend_media:/app/media
      - backend_backups:/app/backups
      - backend_exports:/app/exports
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - face_net

  # -- Celery Worker (async face processing + notifications) --------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face_analytics_celery
    restart: unless-stopped
    command: >
      celery -A app.celery_app worker
        --loglevel=info
        --concurrency=2
        --queues=face_processing,notifications,faiss,default
        --max-tasks-per-child=200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-faceadmin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/face_analytics
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
    volumes:
      - backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - face_net

  # -- Flower (Celery monitoring UI) -------------------------------------------
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face_analytics_flower
    restart: unless-stopped
    command: >
      celery -A app.celery_app flower
        --port=5555
        --broker=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
        --basic_auth=${FLOWER_USER:?Set FLOWER_USER}:${FLOWER_PASSWORD:?Set FLOWER_PASSWORD}
    depends_on:
      - redis
    env_file:
      - backend/.env
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    networks:
      - face_net
    profiles:
      - monitoring

  # -- Frontend (Nginx) ---------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: face_analytics_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - face_net

  # -- Prometheus (metrics scraping) -------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: face_analytics_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - face_net
    profiles:
      - monitoring

  # -- Grafana (dashboards) -----------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: face_analytics_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?Set GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:${GRAFANA_PORT:-3000}/"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - face_net
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  backend_media:
  backend_backups:
  backend_exports:
  prometheus_data:
  grafana_data:

networks:
  face_net:
    driver: bridge
