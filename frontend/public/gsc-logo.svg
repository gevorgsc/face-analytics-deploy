<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer dashed ring -->
  <circle cx="100" cy="100" r="95" stroke="#1a2d5a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- Inner solid ring -->
  <circle cx="100" cy="100" r="85" stroke="#1a2d5a" stroke-width="1.5"/>
  <!-- Inner thin ring -->
  <circle cx="100" cy="100" r="80" stroke="#1a2d5a" stroke-width="0.8"/>

  <!-- GSC Letters -->
  <text x="100" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="700" fill="#1a2d5a" letter-spacing="-2">GSC</text>

  <!-- Decorative lines -->
  <line x1="28" y1="100" x2="56" y2="100" stroke="#1a2d5a" stroke-width="1.2"/>
  <line x1="144" y1="100" x2="172" y2="100" stroke="#1a2d5a" stroke-width="1.2"/>

  <!-- Top curved text: GENERAL SECURITY COMPANY -->
  <path id="topArc" d="M 18,100 A 82,82 0 0,1 182,100" fill="none"/>
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600"
        fill="#1a2d5a" letter-spacing="3">
    <textPath href="#topArc" startOffset="8%">GENERAL SECURITY COMPANY</textPath>
  </text>

  <!-- Bottom curved text: LLC -->
  <path id="botArc" d="M 40,120 A 65,65 0 0,0 160,120" fill="none"/>
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600"
        fill="#1a2d5a" letter-spacing="8">
    <textPath href="#botArc" startOffset="30%">LLC</textPath>
  </text>

  <!-- Small stars/dots at sides -->
  <circle cx="34" cy="100" r="2.5" fill="#1a2d5a"/>
  <circle cx="166" cy="100" r="2.5" fill="#1a2d5a"/>
</svg>
